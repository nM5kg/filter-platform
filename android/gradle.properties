# Filter Platform Android app — Gradle properties.
# Proxy settings (if this sandbox needs them) live in the Gradle user
# home's gradle.properties — on this VM that is ~/.gradle/gradle.properties
# (/home/hatch/.gradle; Java's user.home here, NOT /root/.gradle).
# 2026-11-18: no proxy is configured there anymore — direct JVM HTTPS and
# JVM-via-proxy both fail (the sandbox intercepts all TCP data from JVM
# processes; see android/GECKOVIEW-PROTOTYPE.md), so proxy settings
# cannot make Gradle download anything on this VM. Local-only, never in git.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m
android.useAndroidX=true
android.nonTransitiveRClass=true
