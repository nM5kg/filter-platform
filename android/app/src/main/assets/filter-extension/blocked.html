<!DOCTYPE html>
<html lang="yi" dir="rtl">
<head>
<meta charset="utf-8">
<title>דער פּלאַץ איז בלאקירט — פֿילטער פּלאַטפאָרם</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 0; font: 16px/1.6 system-ui, sans-serif; background: #f9fafb; color: #111827; direction: rtl; }
  .wrap { max-width: 560px; margin: 12vh auto 0; padding: 32px 28px; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,.06); text-align: center; }
  .shield { font-size: 48px; line-height: 1; }
  h1 { font-size: 24px; margin: 12px 0 4px; }
  .domain { font-size: 18px; font-weight: 700; color: #b91c1c; direction: ltr; word-break: break-all; }
  p { margin: 10px 0; }
  .policy { font-size: 14px; color: #6b7280; }
  .actions { margin-top: 22px; display: flex; flex-direction: column; gap: 10px; }
  a.btn, button.btn { display: block; padding: 11px; border-radius: 8px; font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; }
  a.primary { background: #1d4ed8; color: #fff; }
  a.secondary { background: #e5e7eb; color: #111827; }
  button.back { background: none; border: 1px solid #d1d5db; color: #374151; }
  .note { font-size: 13px; color: #6b7280; margin-top: 18px; }
</style>
</head>
<body data-domain="{{DOMAIN}}" data-policy="{{POLICY_NAME}}">
  <div class="wrap">
    <div class="shield">🛡️</div>
    <h1>דער פּלאַץ איז בלאקירט</h1>
    <div class="domain" id="blocked-domain">…</div>
    <p>דער פֿילטער האָט בלאקירט דעם פּלאַץ לויט דער פּאָליסי פֿון אײַער דיווייס.</p>
    <p class="policy">פּאָליסי: <span id="policy-name">…</span></p>
    <div class="actions">
      <a class="btn primary" id="review-link" href="https://filter-platform-dashboard.pages.dev" target="_blank" rel="noopener">בעטן אַן איבערקוק פֿון דעם פּלאַץ</a>
      <a class="btn secondary" href="https://filter-platform-dashboard.pages.dev" target="_blank" rel="noopener">גיי צום דאַשבאָרד</a>
      <button class="btn back" id="back-btn" type="button">↩ צוריק צום פֿריערדיקן בלאַט</button>
    </div>
    <p class="note">Filter Platform — Free kosher internet filter. דער פּלאַץ ווערט נישט געלאָדן; קיין אינהאַלט פֿון אים איז נישט געוויזן געוואָרן.</p>
  </div>
<script src="blocked.js"></script>
</body>
</html>
